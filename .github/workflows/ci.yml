# CI — typecheck, test, and build every package on push to main and on all PRs.
#
# Mirrors the local "definition of done": `pnpm run typecheck` + `pnpm test` + `pnpm run build-all`
# (the same commands a contributor runs). The publish workflow re-runs this same gate before
# releasing, so a green tag is always a green build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    name: build-test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its built-in pnpm cache works.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build all packages
        run: pnpm run build-all
